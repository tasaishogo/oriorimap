AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  OriOriMap — データ・API基盤（T002）+ 認証基盤（T003）+ 配信基盤（T004）。DynamoDB シングルテーブル /
  S3×2 / HTTP API + Cognito JWT Authorizer / Lambda（api・cleanup）/
  EventBridge Scheduler / 監視（Alarm・Budgets）/ Cognito User Pool（Lite）
  + 配信基盤（T004）。CloudFront（SPA・メディア・API/embed の単一オリジン集約）。
  Google IdP は T013、独自ドメイン・ACM は T031 で追加する。
  正本: docs/spec/02_design.md §2・§3・§4.3・§4.5・§6

# ---------------------------------------------------------------------------
# ビルドの前提
#   Lambda は SAM の BuildMethod: esbuild でバンドルする。SAM CLI は esbuild を
#   PATH 上か対象パッケージの node_modules から探すが、npm workspaces では
#   esbuild がルートへ巻き上げられて backend/node_modules に無い。そのため
#   `sam build` は **必ず npm 経由**で呼ぶ（npm が node_modules/.bin を PATH に
#   載せる）:  npm run sam:build -- --config-env <env>
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# パラメータ
#   実アドレス・環境固有値はテンプレートにも samconfig.toml にも書かない
#   （OSS 公開リポジトリのため）。デプロイ時に --parameter-overrides で注入する。
# ---------------------------------------------------------------------------
Parameters:
  AlertEmail:
    Type: String
    Default: ''
    Description: >-
      CloudWatch Alarm（SNS）と AWS Budgets の通知先メールアドレス。
      空の場合は SNS サブスクリプションと Budgets を作成しない（トポロジ検証のみ可能）。
  MonthlyBudgetUsd:
    Type: Number
    Default: 10
    MinValue: 1
    Description: >-
      AWS Budgets の月次上限（USD）。80%（既定では $8）で実績通知、
      100% で予測通知する。design §3「監視」行の $8 = 目標の80% に対応。
  CreateBudget:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      AWS Budgets はアカウント全体を対象とするため、複数環境スタックで
      重複作成しない。dev スタックのみ true、prod スタックは false にする。
  AppCallbackUrls:
    Type: CommaDelimitedList
    Default: http://localhost:5173/
    Description: >-
      Google フェデレーション後のリダイレクト先（Cognito App client の CallbackURLs）。
      CloudFront ドメイン確定後（T004/T005）に dev/prod の URL を追加する。
  AppLogoutUrls:
    Type: CommaDelimitedList
    Default: http://localhost:5173/
    Description: サインアウト後のリダイレクト先（Cognito App client の LogoutURLs）。
Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]
  ShouldCreateBudget: !And
    - !Condition HasAlertEmail
    - !Equals [!Ref CreateBudget, 'true']

Globals:
  Function:
    # nodejs24.x: GA・LTS でサポート期限 2028年4月（design §3 の nodejs22.x から
    # 更新。2026-08-11 決定）。最新の nodejs26.x は preview で AWS が本番利用を
    # 非推奨としており、実行ログに警告が出るため採用しない。26 が GA になったら
    # この 1 行の変更で移行する。
    Runtime: nodejs24.x
    Architectures: [arm64]
    Timeout: 15
    MemorySize: 512
    # 生成される実行ロールに Permissions Boundary を付ける（cfn-guard 10-iam-role が要求）。
    # gate は Processed テンプレートを静的検証するため、条件分岐（Fn::If）で包むと
    # 「検証不能」として fail-closed で弾かれる。素の Fn::Sub 文字列形で直書きすること。
    # mvm 環境以外へ流用する場合はこの行（と ScheduleV2 側の同項目）を削除する。
    PermissionsBoundary: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/mvm-boundary'
    Environment:
      Variables:
        MAIN_TABLE: !Ref MainTable
        MEDIA_BUCKET: !Ref MediaBucket
        POWERTOOLS_SERVICE_NAME: oriorimap
        POWERTOOLS_LOG_LEVEL: INFO

Resources:
  # -------------------------------------------------------------------------
  # データ: DynamoDB シングルテーブル（design §6）
  #   PK/SK + GSI1（公開一覧・cleanup走査）+ GSI2（オーナー別一覧）
  #   ユーザーデータのため Retain。dev/prod いずれもスタック削除で消さない。
  # -------------------------------------------------------------------------
  MainTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${AWS::StackName}-main'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
        - { AttributeName: GSI2PK, AttributeType: S }
        - { AttributeName: GSI2SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        # GSI1: PUBLIC#MAP / PUBLIC#OVL の公開一覧、IMGSTATUS#*・USERSTATUS#* の cleanup 走査
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        # GSI2: USER#<ownerId> のマイページ一覧
        - IndexName: GSI2
          KeySchema:
            - { AttributeName: GSI2PK, KeyType: HASH }
            - { AttributeName: GSI2SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      # RateLimit エンティティ（design §6）の 2 時間 TTL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # -------------------------------------------------------------------------
  # ストレージ: S3 ×2（design §2・§3「バックアップ」行）
  # -------------------------------------------------------------------------
  # SPA 静的アセット: 再ビルド可能なためバージョニング対象外・スタック削除で消してよい
  SpaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub '${AWS::StackName}-spa-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  # メディア（ユーザーアップロード画像）: バージョニング有効。
  # アプリは通常の DeleteObject（削除マーカー作成）で即時不可視化し、
  # 物理削除はライフサイクル（非現行30日失効＋孤立削除マーカー整理）に任せる。
  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${AWS::StackName}-media-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-noncurrent-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: clean-expired-delete-markers
            Status: Enabled
            ExpiredObjectDeleteMarker: true

  # -------------------------------------------------------------------------
  # 認証: Cognito User Pool（design §4.3）
  #   ログインUIは自前実装（aws-amplify/auth headless + shadcn/ui・SRP）。
  #   Cognito の Hosted UI / managed login は使わない――ログインページの
  #   日本語化は managed login 限定機能で Essentials 以上が必要なため
  #   （Lite で使えるのは英語の classic hosted UI のみ）。
  #   Google IdP・SRP認証・ユーザーグループはいずれも Lite に含まれる。
  # -------------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    # ユーザーアカウント（個人情報）を保持するため MainTable と同じ扱いにする
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      # Lite: 無料枠 10,000 MAU。passkey/パスワードレス等の上位機能は使わない
      UserPoolTier: LITE
      # メールアドレスをユーザー名として使う（大文字小文字を区別しない）
      UsernameAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      AutoVerifiedAttributes: [email]
      MfaConfiguration: 'OFF'
      # 使い捨て検証スタックを削除できるようにする。prod は §10 の課題として有効化を検討
      DeletionProtection: INACTIVE
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        # R1.1 の「表示名」。DynamoDB 側の displayName（design §6）と併せて保持する
        - Name: name
          AttributeDataType: String
          Required: true
          Mutable: true
      # 主要利用者層（地域住民・中高年含む）を踏まえ、記号・大文字の必須化は避け
      # 長さと英小文字＋数字で担保する。R1.3 はハッシュ保存＝Cognito 委譲で満たす
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: false
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }
      # T032 で SES 連携（EmailSendingAccount: DEVELOPER）へ切り替える
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      # 確認は「コード」方式。リンク方式（CONFIRM_WITH_LINK）は Cognito ドメインの
      # 確認ページ（Lite では英語の classic hosted UI）へ飛ぶため日本語化できない
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: '【OriOriMap】メールアドレスの確認'
        EmailMessage: "OriOriMap へのご登録ありがとうございます。\n確認コード: {####}\n\nこのコードを登録画面に入力してください。\nお心当たりのない場合はこのメールを破棄してください。"
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: [email]

  # 管理者グループ（R8.2 / design §4.3）。メンバー付与は運用手順（T027 で文書化）
  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: admin
      Description: OriOriMap 管理者（通報対応・非公開化/削除の権限）
      Precedence: 0

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${AWS::StackName}-spa'
      UserPoolId: !Ref UserPool
      # SPA なのでクライアントシークレットは持たない
      GenerateSecret: false
      ExplicitAuthFlows:
        # ブラウザからの通常ログイン。パスワードはネットワークに送出されない
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        # AWS 認証情報が必要な管理フロー。T003 の疎通検証と T036 の E2E で使う
        # （ブラウザからは利用できない）。平文パスワードを送る
        # ALLOW_USER_PASSWORD_AUTH は有効化しない
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
      # Google フェデレーション用（Google IdP 自体の追加は T013）
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: !Ref AppCallbackUrls
      LogoutURLs: !Ref AppLogoutUrls
      # ユーザーの存在有無を推測させない（列挙攻撃対策）
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  # Google フェデレーションのリダイレクト先として必要（自前UIでも省略できない）。
  # ManagedLoginVersion: 1 = classic hosted UI（Lite では唯一の選択肢）。
  # ただし signInWithRedirect は identity_provider を指定するため、Cognito は
  # 自前ページを描画せず即座に Google へ転送する（英語画面は表示されない）。
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref AWS::StackName
      ManagedLoginVersion: 1

  # -------------------------------------------------------------------------
  # API: HTTP API（design §2）+ Cognito JWT Authorizer（design §4.3）
  # -------------------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      # 想定外のトラフィックでコストが跳ねないよう既定スロットリングを入れる
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 20
      Auth:
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
              audience: [!Ref UserPoolClient]
        # fail-closed: 既定で認証を要求し、公開ルートだけが明示的に
        # `Auth: { Authorizer: NONE }` でオプトアウトする。逆にすると
        # 指定漏れが「気づかないまま公開」になるため、この向きを守ること
        DefaultAuthorizer: CognitoJwtAuthorizer

  # -------------------------------------------------------------------------
  # Lambda: API 本体（design §4.2）。T002 時点のルートは GET /api/health のみ
  # -------------------------------------------------------------------------
  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension: ['.js=.mjs']
        Target: es2022
        Minify: false
        Sourcemap: false
        EntryPoints: [src/handlers/api.ts]
    Properties:
      CodeUri: backend/
      Handler: api.handler
      Description: OriOriMap API（Hono）。T003 時点では /api/health と /api/health-auth のみ
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref MainTable }
        - S3CrudPolicy: { BucketName: !Ref MediaBucket }
      Events:
        # 公開ルート: DefaultAuthorizer を明示的にオプトアウトする
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/health
            Method: GET
            Auth:
              Authorizer: NONE
        # Authorizer 検証用（T003）。ハンドラは health と同一で、
        # 差は JWT Authorizer を通すかどうかだけ
        HealthAuth:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/health-auth
            Method: GET

  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ApiFunction}'
      RetentionInDays: 14

  # -------------------------------------------------------------------------
  # Lambda: cleanup バッチ（design §4.5。実装は T029・ここでは空実装＋結線のみ）
  # -------------------------------------------------------------------------
  CleanupFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension: ['.js=.mjs']
        Target: es2022
        Minify: false
        Sourcemap: false
        EntryPoints: [src/handlers/cleanup.ts]
    Properties:
      CodeUri: backend/
      Handler: cleanup.handler
      Description: OriOriMap cleanup バッチ（PENDING_DELETE回収 / 未添付画像回収 / 退会段階削除）
      Timeout: 300
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref MainTable }
        - S3CrudPolicy: { BucketName: !Ref MediaBucket }
      Events:
        Daily:
          Type: ScheduleV2
          Properties:
            # 毎日 03:00 JST（design §4.5）
            ScheduleExpression: cron(0 3 * * ? *)
            ScheduleExpressionTimezone: Asia/Tokyo
            Description: OriOriMap 日次 cleanup
            # Name 未指定だと SAM は「<関数論理ID><イベントID>」（CleanupFunctionDaily）を
            # スケジュール名にする（CFn 自動採番のスタック名プレフィックスは付かない）。
            # CFn サービスロールの scheduler 権限は schedule/*/oriorimap-* に限定されて
            # いるため、スタック名始まりの名前を明示する（T005-b 初回構築の実デプロイで
            # AccessDenied になった実績あり）。
            Name: !Sub '${AWS::StackName}-cleanup-daily'
            # ScheduleV2 は EventBridge Scheduler のターゲット用に別ロールを生成する。
            # Globals.Function.PermissionsBoundary は「関数の実行ロール」限定で
            # ここには波及しない（AWS SAM 公式 sam-property-function-schedulev2 の
            # Note: PermissionsBoundary は scheduler schedule's target IAM role に適用）。
            # cfn-guard 10-iam-role は全 IAM ロールに boundary を要求するため明示する。
            # Globals 側と同じく Fn::If で包まず Fn::Sub 文字列形で直書きする（gate の静的検証要件）。
            PermissionsBoundary: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/mvm-boundary'

  CleanupFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${CleanupFunction}'
      RetentionInDays: 14

  # -------------------------------------------------------------------------
  # 配信: CloudFront（design §2）
  #   default   → S3 SPA（OAC）
  #   /media/*  → S3 メディア（OAC）※オブジェクトキーは media/ プレフィックス配下
  #   /api/*    → HTTP API（キャッシュ無効）
  #   /embed/*  → HTTP API（キャッシュ無効）
  #   単一オリジンに集約するため CORS 設定が不要になる。
  # -------------------------------------------------------------------------
  CloudFrontOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-s3-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # SPA のクライアントサイドルーティング（§5.1 の9ルート）を成立させる。
  # CloudFront の CustomErrorResponses はディストリビューション全体に効くため
  # 使えない――API が返す 404（design §4.2「非公開・不存在は404」）まで
  # index.html + 200 に書き換えてしまい API 契約を壊す。
  # 既定ビヘイビアにだけ関数を付けることで /api/* ・ /embed/* は影響を受けない。
  SpaRoutingFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-spa-routing'
      AutoPublish: true
      FunctionConfig:
        Comment: 拡張子を持たないパスを /index.html へ書き換える（SPAルーティング）
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          var lastSlash = uri.lastIndexOf('/');
          var lastSegment = uri.substring(lastSlash + 1);
          // 末尾がディレクトリ、または拡張子を持たない = SPA のルート
          if (lastSegment.length === 0 || lastSegment.indexOf('.') === -1) {
            request.uri = '/index.html';
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'OriOriMap (${AWS::StackName})'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        # PriceClass_100 は日本のエッジを含まないため 200 を選ぶ（転送は無料枠1TB/月）
        PriceClass: PriceClass_200
        Origins:
          - Id: spa
            DomainName: !GetAtt SpaBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOac.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: media
            DomainName: !GetAtt MediaBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOac.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: api
            DomainName: !Sub '${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: spa
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRoutingFunction.FunctionARN
        CacheBehaviors:
          - PathPattern: /media/*
            TargetOriginId: media
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            # Host ヘッダーを転送しない（API Gateway が不一致 Host を拒否するため）。
            # Authorization を含む他のビューワーヘッダーはすべて転送される。
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
          - PathPattern: /embed/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader

  # OAC 経由の CloudFront だけに読み取りを許す（バケットは全公開ブロック済み）
  SpaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SpaBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${SpaBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${MediaBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  # -------------------------------------------------------------------------
  # 監視: CloudWatch Alarm（Lambda errors・APIGW 5xx）+ AWS Budgets（design §3・§7）
  # -------------------------------------------------------------------------
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${AWS::StackName}-alerts'
      DisplayName: OriOriMap Alerts

  AlertTopicSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  ApiFunctionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-api-lambda-errors'
      AlarmDescription: API Lambda がエラーを返した（design §7「Lambda関数エラー率上昇」）
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref ApiFunction }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  CleanupFunctionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-cleanup-lambda-errors'
      AlarmDescription: cleanup バッチが失敗した（冪等なので翌日再開するが検知はする）
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref CleanupFunction }
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  HttpApiServerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-httpapi-5xx'
      AlarmDescription: HTTP API が 5xx を返した（design §7「APIGW 5xx」）
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - { Name: ApiId, Value: !Ref HttpApi }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: ShouldCreateBudget
    Properties:
      Budget:
        BudgetName: !Sub '${AWS::StackName}-monthly-cost'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref AlertEmail }
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref AlertEmail }

Outputs:
  ApiEndpoint:
    Description: >-
      HTTP API の直アクセス URL。通常の利用経路は CloudFront（AppUrl）で、
      こちらはオリジン直叩きの疎通確認用に残す。
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  AppUrl:
    Description: >-
      アプリの入口 URL（CloudFront）。deploy-dev.yml のスモークテスト契約。
      T031 で独自ドメイン oriorimap.kiryu.tech に切り替わる。
    Value: !Sub 'https://${Distribution.DomainName}'
  DistributionId:
    Description: >-
      CloudFront ディストリビューション ID
      （deploy-dev.yml のキャッシュ invalidation 契約）。
    Value: !Ref Distribution
  DistributionDomainName:
    Description: CloudFront の既定ドメイン（dev 環境はこれを使う。Geolonia キーへ登録=T039）
    Value: !GetAtt Distribution.DomainName
  MainTableName:
    Description: DynamoDB シングルテーブル名
    Value: !Ref MainTable
  SpaBucketName:
    Description: SPA 静的アセットのバケット名（deploy-dev.yml の s3 sync 先）
    Value: !Ref SpaBucket
  MediaBucketName:
    Description: メディア（ユーザーアップロード画像）のバケット名
    Value: !Ref MediaBucket
  AlertTopicArn:
    Description: アラート通知の SNS トピック ARN
    Value: !Ref AlertTopic
  UserPoolId:
    Description: Cognito User Pool ID（フロントの aws-amplify 設定に注入する）
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito App client ID（SPA・シークレットなし）
    Value: !Ref UserPoolClient
  CognitoDomain:
    Description: >-
      Cognito ドメイン。Google フェデレーションのリダイレクト先。
      Google OAuth クライアントの承認済みリダイレクト URI は
      <この値>/oauth2/idpresponse を登録する（T010）。
    Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
  JwtIssuer:
    Description: HTTP API JWT Authorizer が検証する issuer
    Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
